services:
  - type: web
    name: finedine-whatsapp-agent
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: finedine-data
      mountPath: /opt/render/project/src/persistent_data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DB_DATA_DIR
        value: /opt/render/project/src/persistent_data
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v20.0
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: "google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free,~google/gemini-flash-latest"
      - key: OPENROUTER_VISION_MODEL
        sync: false
      - key: WHISPER_API_KEY
        sync: false
      - key: WHISPER_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: WHISPER_MODEL
        value: whisper-large-v3
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: PRINT_AGENT_TOKEN
        generateValue: true
      - key: STORE_NAME
        value: Fine Dine Family Restaurant
      - key: STORE_PHONE
        sync: false
      - key: STORE_TIMEZONE
        value: Asia/Dubai
      - key: STORE_OPEN_HOUR
        value: "8"
      - key: STORE_CLOSE_HOUR
        value: "2"
      - key: STORE_ORDER_CUTOFF_MINUTES
        value: "30"
      - key: DELIVERY_FEE
        value: "0"
      - key: FREE_DELIVERY_THRESHOLD
        value: "10"
      - key: CURRENCY
        value: AED
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_CONFIG_ID
        sync: false
      - key: BILLING_API_BASE_URL
        sync: false
      - key: BILLING_API_KEY
        sync: false
