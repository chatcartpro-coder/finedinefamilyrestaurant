services:
  - type: web
    name: finedine-whatsapp-agent
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: finedine-data
      mountPath: /opt/render/project/src/persistent_data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DB_DATA_DIR
        value: /opt/render/project/src/persistent_data
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v20.0
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: ~openai/gpt-luna-latest
      - key: OPENROUTER_FALLBACK_MODELS
        value: "~google/gemini-flash-latest,google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free"
      - key: OPENROUTER_VISION_MODEL
        value: ~google/gemini-flash-latest
      - key: OPENROUTER_VISION_FALLBACK_MODELS
        value: "~google/gemini-flash-latest,~openai/gpt-luna-latest,anthropic/claude-sonnet-5.5"
      - key: WHISPER_API_KEY
        sync: false
      - key: WHISPER_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: PRINT_AGENT_TOKEN
        generateValue: true
      - key: BROADCAST_CRON_SECRET
        generateValue: true
      - key: STORE_NAME
        value: Fine Dine Family Restaurant
      - key: STORE_PHONE
        sync: false
      - key: STORE_TIMEZONE
        value: Asia/Dubai
      - key: STORE_OPEN_HOUR
        value: "8"
      - key: STORE_CLOSE_HOUR
        value: "2"
      - key: STORE_ORDER_CUTOFF_MINUTES
        value: "30"
      - key: DELIVERY_FEE
        value: "0"
      - key: FREE_DELIVERY_THRESHOLD
        value: "10"
      - key: CURRENCY
        value: AED
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_CONFIG_ID
        sync: false
      - key: BILLING_API_BASE_URL
        sync: false
      - key: BILLING_API_KEY
        sync: false

  # Daily trigger for the customer retargeting campaign (see
  # broadcasts/retargeting.py). Render cron jobs can't attach a persistent
  # disk (confirmed via Render's docs - disks are unavailable to cron
  # services entirely, and never shared between two services), so this
  # can't read the SQLite database directly the way the web service does.
  # It just calls the web service's own /broadcast/run-retargeting
  # endpoint, authenticated with the same BROADCAST_CRON_SECRET - all the
  # real work (DB queries, sending) happens inside the already-running web
  # service, which already has the disk and the WhatsApp credentials.
  - type: cron
    name: finedine-retargeting-broadcast
    env: python
    plan: starter
    schedule: "0 6 * * *"
    buildCommand: "true"
    startCommand: >
      curl -sf -X POST
      -H "Authorization: Bearer $BROADCAST_CRON_SECRET"
      https://finedine-whatsapp-agent.onrender.com/broadcast/run-retargeting
    envVars:
      - key: BROADCAST_CRON_SECRET
        sync: false
